<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kode QR</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 10px; width: 300px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button, .download-btn { padding: 10px 20px; font-size: 16px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        button:hover, .download-btn:hover { background-color: #0056b3; }
        .qr-result { margin-top: 20px; }
    </style>
 </head>
 <body>
    <div class="container">
        <h2>Aplikasi Generator Kode QR</h2>
        <form method="POST">
            <input type="text" name="text" placeholder="Masukkan teks atau tautan..." required>
            <button type="submit">Buat QR Code</button>
        </form>

        {% if qr_image %}
        <div class="qr-result">
            <h3>Hasil Kode QR Anda:</h3>
            <img src="data:image/png;base64,{{ qr_image }}" alt="Kode QR"><br>
            <a href="data:image/png;base64,{{ qr_image }}" download="qrcode.png" class="download-btn">Unduh QR Code</a>
        </div>
        {% endif %}
    </div>
 </body>
</html>
